name: ENTSO-E NL probe and one-off backfill

# One-off gate and backfill for the ENTSO-E NL substitution. NEVER
# scheduled and never part of PR CI (workflow_dispatch only). Run on the
# feature branch:
#
#   mode=probe    — runs the probe gate (scripts/probe-entsoe.mjs) with the
#                   ENTSOE_API_TOKEN secret and prints the full report to
#                   the job log; figures are recorded in the PR description.
#   mode=backfill — runs the probe gate first and, only if every acceptance
#                   criterion passes, runs the one-off backfill
#                   (scripts/backfill.mjs, full 2015-present history, which
#                   includes the trailing window) and commits the rebuilt
#                   public/data/snapshot.json to this branch.
#
# If any probe criterion fails, the backfill does not run and the figures
# are reported in the PR description instead. The token is read only from
# the ENTSOE_API_TOKEN secret and is never logged, echoed or committed.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe: gate only; backfill: gate, then one-off backfill + commit"
        required: true
        type: choice
        default: probe
        options:
          - probe
          - backfill

permissions:
  contents: write

jobs:
  entsoe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe gate (ENTSO-E NL)
        id: probe
        run: node --experimental-strip-types scripts/probe-entsoe.mjs
        env:
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
      - name: One-off backfill from ENTSO-E NL data
        if: inputs.mode == 'backfill' && steps.probe.outcome == 'success'
        run: node --experimental-strip-types scripts/backfill.mjs
        env:
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      - name: Commit rebuilt snapshot if changed
        if: inputs.mode == 'backfill' && steps.probe.outcome == 'success'
        run: |
          git config user.name "green-grid-snapshot-bot"
          git config user.email "actions@github.com"
          git add public/data/snapshot.json
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "data: rebuild snapshot from ENTSO-E NL generation and load"
            git push
          fi
