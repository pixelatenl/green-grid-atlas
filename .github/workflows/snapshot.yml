name: Refresh data snapshot

# Daily server-side fetch of the energy-charts.info v2 rolling window and
# tomorrow's day-ahead prices, plus the Open-Meteo weather overlay and the
# European score summaries (NL daily, all zones on the first run of each ISO
# week). Writes public/data/snapshot.json and commits it to main, which
# triggers the build workflow. The backfill (scripts/backfill.mjs) NEVER
# runs here — it is a one-time local/mini-PC job.
#
# 12:35 UTC lands after the day-ahead publication (~13:00 CET) in both DST
# states (CET = UTC+1, CEST = UTC+2).
#
# The Mistral key is present only on this job; the build jobs run without
# it and narration simply stays hidden (fail-soft).

on:
  schedule:
    # Daily, 12:35 UTC.
    - cron: "35 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: node --experimental-strip-types scripts/snapshot.mjs
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      - name: Commit snapshot if changed
        run: |
          git config user.name "green-grid-snapshot-bot"
          git config user.email "actions@github.com"
          git add public/data/snapshot.json
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "data: refresh grid snapshot $(date -u +%F)"
            git push
          fi
